# Pinned theme is imported once below, with only the assets we use.
title: Núcleo Filatélico de Braga
baseURL: https://nfb-pt.github.io/
timeZone: Europe/Lisbon
defaultContentLanguage: pt
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
summaryLength: 30
pagination:
  pagerSize: 9
removePathAccents: true
taxonomies:
  category: categories
  tag: tags
outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS
markup:
  goldmark:
    renderer:
      unsafe: false
sitemap:
  changeFreq: monthly
  priority: 0.5
module:
  mounts:
    - source: static
      target: static
    # Only fonts are needed from the theme's static assets.
    - source: themes/dot-org-hugo-theme/static/fonts
      target: static/fonts
  imports:
    - path: dot-org-hugo-theme
      ignoreConfig: true
      mounts:
        - source: layouts
          target: layouts
        - source: assets
          target: assets
outputFormats:
  Archive:
    mediaType: application/json
    baseName: archive
    isPlainText: true
    notAlternative: true
