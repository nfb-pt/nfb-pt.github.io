<header class="header nfb-header">
  <div class="container wrap nfb-header__inner">
    <a
      class="nfb-brand"
      href="{{ .Site.Home.RelPermalink }}"
      aria-label="{{ .Site.Title }} — {{ i18n "home" }}"
    >
      {{ with .Site.Params.logo }}
        <img src="{{ . | relURL }}" width="49" height="64" alt="" />
      {{ else }}
        <span class="nfb-monogram" aria-hidden="true"
          >NFB<span>BRAGA</span></span
        >
      {{ end }}
      <span class="nfb-wordmark">{{ .Site.Title }}</span>
    </a>
    <div class="nfb-header__tools">
      {{ partial "language-selector.html" . }}
      <a
        class="search-link"
        href="{{ (.Site.GetPage "search").RelPermalink }}"
        aria-label="{{ i18n "search" }}"
        ><svg
          aria-hidden="true"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <circle cx="10" cy="10" r="6.5" />
          <path d="m15 15 6 6" /></svg
      ></a>
      <button
        class="menu-toggle"
        aria-expanded="false"
        aria-controls="main-navigation"
        hidden
      >
        {{ i18n "menu" }} <span aria-hidden="true">☰</span>
      </button>
    </div>
    <nav
      id="main-navigation"
      class="nfb-nav"
      aria-label="{{ i18n "navigation" }}"
    >
      <ul>
        {{ range .Site.Menus.main }}
          <li>
            <a
              href="{{ .URL }}"
              {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
                aria-current="{{ if $.IsMenuCurrent "main" . }}
                  page
                {{ else }}
                  true
                {{ end }}"
              {{ end }}
              >{{ .Name }}</a
            >
          </li>
        {{ end }}
        <li class="mobile-search">
          <a href="{{ ($.Site.GetPage "search").RelPermalink }}"
            >{{ i18n "search" }}</a
          >
        </li>
      </ul>
    </nav>
  </div>
</header>
