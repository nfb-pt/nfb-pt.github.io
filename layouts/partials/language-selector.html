<nav class="nfb-languages" aria-label="{{ i18n "language" }}">
{{ range .Sites }}
  {{ $target := .Home }}{{ $lang := .Language.Lang }}
  {{ range $.AllTranslations }}{{ if eq .Language.Lang $lang }}{{ $target = . }}{{ end }}{{ end }}
  <a href="{{ $target.RelPermalink }}" lang="{{ .Language.LanguageCode }}" hreflang="{{ .Language.LanguageCode }}" aria-label="{{ .Language.LanguageName }}"{{ if eq $.Language.Lang $lang }} aria-current="true"{{ end }}>{{ upper $lang }}</a>
{{ end }}
</nav>
